version: "2.4"
services:
  app:
    container_name: "application-server"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    image: "us-central1-docker.pkg.dev/verily-workbench-public/apps/workbench-jupyter:latest@sha256:98fb63b8ee2445e8b8de3e83df9884a23ca3aa6418028237679a0687d6e5e329"
    user: "jupyter:${DOCKER_GID}"
    restart: always
    volumes:
      - .:/workspace:cached
      # mount Host machine's docker.sock to container's docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      # mount Host machine's /etc/group to container's /etc/host-group
      - /etc/group:/etc/host-group
      # mount Host machine's default docker config dir to container's jupyter user docker config dir
      - /etc/docker:/home/jupyter/.docker
    ports:
      - "8888:8888"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
networks:
  app-network:
    external: true
