services:
  app:
    # The container name must be "application-server"
    container_name: "application-server"
    shm_size: "${templateOption:shmSize}"
    mem_limit: "${templateOption:memoryLimit}"
    image: "caddy:2.11-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e"
    restart: always
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
    ports:
      - 8080:8080
    networks:
      - app-network
      - playground-apps

  playground:
    build:
      context: ./playground
    container_name: "playground"
    user: "playground:${DOCKER_GID}"
    restart: always
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "playground"
      DB_USER: "playground_user"
      DB_PASSWORD: "playground_password"
      CADDY_HOST: "application-server"
      CADDY_PORT: "2019"
      CLOUD: "${templateOption:cloud}"
    volumes:
      # mount Host machine's docker.sock to container's docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      # mount Host machine's /etc/group to container's /etc/host-group
      - /etc/group:/etc/host-group
      # mount apps directory for devcontainer builds
      - ./apps:/workspace/apps
      # mount startup scripts from parent directory
      - ./startupscript:/workspace/startupscript
      # mount features directory for devcontainer features
      - ../../features:/workspace/features:ro
    networks:
      - playground-apps
      - playground

  db:
    image: "postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"
    restart: always
    environment:
      POSTGRES_USER: "playground_user"
      POSTGRES_PASSWORD: "playground_password"
      POSTGRES_DB: "playground"
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - playground
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  pg_data:

networks:
  # The Docker network must be named "app-network". This is an external network
  # that is created outside of this docker-compose file.
  app-network:
    external: true
  playground:
  playground-apps:
